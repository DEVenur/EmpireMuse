services:
  - type: web
    name: empiremuse
    env: python
    plan: free
    repo: https://github.com/DiscordEmpireHub/EmpireMuse.git
    buildCommand: pip3 install -r requirements.txt --no-cache-dir
    startCommand: python3 main.py
    envVars:
      - key: TOKEN_BOT_1
        sync: false
      - key: TOKEN_BOT_2
        sync: false
      - key: TOKEN_BOT_3
        sync: false
      - key: DEFAULT_PREFIX
        sync: false
      - key: MONGO
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MONGO_SSL_FIX
        value: true
      - key: PLAYER_SESSIONS_MONGODB
        value: true
      - key: AUTO_DOWNLOAD_LAVALINK_SERVERLIST
        value: true
    autoDeploy: false # opcional
