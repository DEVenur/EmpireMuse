<defs>
  <filter id="cloud" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="45" result="b"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="4" seed="7" result="n"/>
    <feDisplacementMap in="b" in2="n" scale="190" xChannelSelector="R" yChannelSelector="G"/>
