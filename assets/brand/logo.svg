  <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDD0FF"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FEF3C7"/><stop offset="1" stop-color="#FBBF24"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BFDBFE"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBCFE8"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
