{# Seletor de skin. Variáveis: nome_campo, rotulo, opcoes, atual, erros, com_vazio, prefixo_id. #}
{% set personalizada = str(atual or "").startswith("> custom_skin:") %}
<label for="campo-{{ prefixo_id }}">{{ rotulo }}</label>
<select id="campo-{{ prefixo_id }}" name="{{ nome_campo }}"{% if erros.get(nome_campo) %} aria-invalid="true" aria-describedby="erro-{{ prefixo_id }}"{% end %}>
  {% if com_vazio %}
  <option value=""{% if not atual %} selected{% end %}>Padrão do servidor</option>
  {% end %}
  {% if personalizada %}
  <option value="{{ atual }}" selected>Personalizada (gerencie no Discord)</option>
  {% end %}
  {% for opcao in opcoes %}
  <option value="{{ opcao }}"{% if not personalizada and opcao == atual %} selected{% end %}>{{ opcao }}</option>
  {% end %}
</select>
{% if erros.get(nome_campo) %}<small id="erro-{{ prefixo_id }}" class="erro-campo">{{ erros[nome_campo] }}</small>{% end %}
