{% set form_id = "form-prefixo" %}
{% set erros = form.erros %}
<form id="form-prefixo" class="form-config" method="post" action="{{ form.acao }}" hx-post="{{ form.acao }}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  {% module xsrf_form_html() %}
  <input type="hidden" name="versao" value="{{ form.versao }}">
  <h2 class="subtitulo">Prefixo dos comandos</h2>
  {% include "_mensagem_form.html" %}
  <label for="campo-prefixo">Prefixo</label>
  <input id="campo-prefixo" type="text" name="prefix" value="{{ form.valores.get('prefix') or '' }}" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false"{% if erros.get("prefix") %} aria-invalid="true" aria-describedby="erro-prefixo ajuda-prefixo"{% else %} aria-describedby="ajuda-prefixo"{% end %}>
  {% if erros.get("prefix") %}<small id="erro-prefixo" class="erro-campo">{{ erros["prefix"] }}</small>{% end %}
  <small id="ajuda-prefixo">De 1 a 5 caracteres, sem espaços. Deixe vazio para voltar ao prefixo padrão.</small>
  <button type="submit">Salvar</button>
</form>
