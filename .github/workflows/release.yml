name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verificar se tag pertence a origin/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar se a tag aponta para commit em origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::A tag '${GITHUB_REF_NAME}' aponta para um commit que não pertence à branch origin/main!"
            exit 1
          fi
          echo "Sucesso: O commit da tag (${GITHUB_REF_NAME}) pertence à branch origin/main."

  verify-ci:
    name: Verificar se CI concluiu com sucesso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar conclusão com sucesso do workflow CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")
          echo "Verificando se o workflow CI concluiu com sucesso para o commit: $COMMIT_SHA"
          SUCCESS_COUNT=$(gh run list --workflow CI --commit "$COMMIT_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$SUCCESS_COUNT" -eq 0 ] && [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "Tentando com GITHUB_SHA: $GITHUB_SHA"
            SUCCESS_COUNT=$(gh run list --workflow CI --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          fi
          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "Sucesso: workflow CI concluiu com sucesso para o commit ($SUCCESS_COUNT execução(ões) bem-sucedida(s))."
          else
            echo "::error::Nenhuma execução bem-sucedida do workflow CI foi encontrada para o commit $COMMIT_SHA."
            gh run list --workflow CI --commit "$COMMIT_SHA" --json databaseId,status,conclusion,url || true
            exit 1
          fi

  docker:
    name: Build e Push da Imagem Docker Hub
    environment: docker-release
    needs:
      - verify-tag
      - verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Autenticar no Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrair metadados do Docker (tags e labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: or4cu1o/empiremuse
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
