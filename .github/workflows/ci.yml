name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI (Lint, Compile e Testes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar uv
        run: python -m pip install "uv==0.13.1"

      - name: Verificar integridade e sincronia dos lockfiles
        run: |
          uv pip compile --generate-hashes --universal --exclude-newer 2026-10-16T00:00:00Z --no-emit-package disnake --no-emit-package disnake-jishaku requirements.txt -o requirements-lock.txt
          uv pip compile --generate-hashes --universal --exclude-newer 2026-10-16T00:00:00Z requirements-dev.txt -o requirements-dev-lock.txt
          git diff --exit-code requirements-lock.txt requirements-dev-lock.txt

      - name: Instalar dependências com hashes
        run: |
          uv pip install --system --require-hashes -r requirements-lock.txt -r requirements-dev-lock.txt

      - name: Instalar dependências Git fixadas por SHA
        run: uv pip install --system --no-deps -r requirements-git.txt

      - name: Verificação de lint (ruff check)
        run: ruff check .

      - name: Verificação de formatação (ruff format)
        run: ruff format --check .

      - name: Verificação de compilação de bytecode
        run: python -m compileall -q main.py empiremuse

      - name: Verificação estática de tipos (mypy)
        continue-on-error: true
        run: mypy

      - name: Execução dos testes automatizados (pytest)
        run: pytest -q
