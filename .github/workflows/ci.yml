name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI (Lint, Compile e Testes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar uv
        run: python -m pip install "uv==0.13.1"

      - name: Instalar dependências
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt "tinymongo[serialization]"

      - name: Verificação de lint (ruff check)
        run: ruff check .

      - name: Verificação de formatação (ruff format)
        run: ruff format --check .

      - name: Verificação de compilação de bytecode
        run: python -m compileall -q main.py empiremuse

      - name: Execução dos testes automatizados (pytest)
        run: pytest -q
