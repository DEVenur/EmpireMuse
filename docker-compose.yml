services:
  bot:
    # Imagem oficial do Docker Hub. Em produção, recomenda-se fixar uma tag específica
    # de versão (ex.: or4cu1o/empiremuse:1.1.0 ou or4cu1o/empiremuse:1) em vez de latest para deploys imutáveis.
    image: ${EMPIREMUSE_IMAGE:-or4cu1o/empiremuse:latest}
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    env_file: .env
    mem_limit: ${EMPIREMUSE_MEM_LIMIT:-1024m}
    memswap_limit: ${EMPIREMUSE_MEM_LIMIT:-1024m}
    volumes:
      - empiremuse-data:/data
    ports:
      - "${EMPIREMUSE_PORT:-127.0.0.1:6000}:6000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    profiles:
      - mongo
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    restart: unless-stopped
    volumes:
      - empiremuse-mongo:/data/db
    env_file:
      - path: .env.mongo
        required: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  empiremuse-data:
  empiremuse-mongo:
