# Configuração mínima de ferramentas. Este arquivo crescerá na fase de
# saneamento (ruff, tipagem etc.); por ora contém apenas o pytest e cobertura.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: caminho feliz rápido (import, config, db, painel); roda primeiro no CI",
    "critical: segurança, persistência, migração, config_loader, contratos Discord/Lavalink e regras puras",
    "regression: um teste por bug real corrigido",
]

[tool.coverage.run]
source = ["empiremuse"]
omit = [
    'repos/*',
    'worktrees/*',
    '.arquivo/*',
    '.local/*',
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 56

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "repos",
    "worktrees",
    ".arquivo",
    ".local",
]

[tool.ruff.lint]
# Regras conservadoras iniciais baseadas no padrão Ruff (E4, E7, E9, F)
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "E722",
]
# Violações legadas pré-existentes ignoradas temporariamente para permitir
# adoção gradual sem risco de quebra de comportamento em produção
ignore = [
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E713",  # test for membership should be 'not in'
    "E714",  # test for identity should be 'is not'
    "E731",  # do not assign a lambda expression
    "E741",  # ambiguous variable name
    "F401",  # imported but unused
    "F403",  # unable to detect undefined names from star import
    "F405",  # name may be undefined, or defined from star imports
    "F541",  # f-string without any placeholders
    "F841",  # local variable is assigned to but never used
]

[tool.mypy]
python_version = "3.13"
packages = ["empiremuse"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

# Adoção gradual de tipagem: ignora erros no código legado pré-existente
# enquanto novos módulos (ex.: empiremuse.rules) mantêm checagem ativa.
[[tool.mypy.overrides]]
module = [
    "empiremuse.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "empiremuse.rules.*",
]
ignore_errors = false

