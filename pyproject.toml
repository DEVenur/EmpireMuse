# Configuração mínima de ferramentas. Este arquivo crescerá na fase de
# saneamento (ruff, tipagem etc.); por ora contém apenas o pytest e cobertura.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: caminho feliz rápido (import, config, db, painel); roda primeiro no CI",
    "critical: segurança, persistência, migração, config_loader, contratos Discord/Lavalink e regras puras",
    "regression: um teste por bug real corrigido",
    "integration: precisa de um serviço descartável fora do pytest (ex.: MONGO_TEST_URI); pulado sem ele",
]

[tool.coverage.run]
source = ["empiremuse"]
omit = [
    'worktrees/*',
    '.arquivo/*',
    '.local/*',
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 56

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "worktrees",
    ".arquivo",
    ".local",
    ".claude",
]

[tool.ruff.lint]
# Regras conservadoras iniciais baseadas no padrão Ruff (E4, E7, E9, F)
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "E722",
    "T201",  # print: a saída vai pelo pacote empiremuse.logs
    "T203",  # pprint
    "G004",  # f-string no logger (a redação e a agregação usam o modelo da mensagem)
    "LOG015",  # chamada ao logger raiz (use um logger nomeado)
]
# Violações legadas pré-existentes ignoradas temporariamente para permitir
# adoção gradual sem risco de quebra de comportamento em produção
ignore = [
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E713",  # test for membership should be 'not in'
    "E714",  # test for identity should be 'is not'
    "E731",  # do not assign a lambda expression
    "E741",  # ambiguous variable name
    "F401",  # imported but unused
    "F403",  # unable to detect undefined names from star import
    "F405",  # name may be undefined, or defined from star imports
    "F541",  # f-string without any placeholders
    "F841",  # local variable is assigned to but never used
]

[tool.ruff.lint.per-file-ignores]
# Script isolado: roda com `python -I -S` em outro processo, sem o pacote empiremuse.logs
# (nem o resto do projeto), então o `print` para o stdout/stderr do processo pai é o único canal.
"empiremuse/updater/proxy.py" = ["T201"]
# Testes de redação: o segredo vai embutido na mensagem por f-string de propósito, para provar que
# o redator e a chave do agregador o limpam mesmo quando o código chamador não usa argumentos do logger.
"tests/logs/test_integration.py" = ["G004"]

[tool.mypy]
python_version = "3.14"
packages = ["empiremuse"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

# Adoção gradual de tipagem: ignora erros no código legado pré-existente
# enquanto novos módulos (ex.: empiremuse.rules) mantêm checagem ativa.
[[tool.mypy.overrides]]
module = [
    "empiremuse.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "empiremuse.rules.*",
]
ignore_errors = false

